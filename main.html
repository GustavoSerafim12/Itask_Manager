<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itask manager</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
  <div id="top_colored_block">

    <p id="title">
      ITask Manager
    </p>

  </div>

    <div id="input_task_div">
      <input type="text" id="input_task_name" placeholder="Tarefa nova:">
      <input type="text" id="input_task_description" placeholder="Descrição:">
      <button id="input_task_button">
      confirmar
     </button>
  </div>

    <div id="task_div_area">

      <div id="individual_task_div" class="sample_task_card">

        <p class="individual_task_name" id="individual_task_name">
        </p>

        <p class="individual_task_description" id="individual_task_description">
          </p>
    
        <button class="individual_task_boolean" id="individual_task_boolean">
          not done
        </button>

        <p class="individual_task_date" id="individual_task_date">
          WD MT DAY YEAR HH:MM:SS GMT-0300 (Horário Padrão de Brasília)
        </p>
      </div>
  </div>

  <script src="script.js" defer></script>
</body>

</html>
